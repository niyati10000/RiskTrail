# Transformer Sequence Model Configuration
model_name: "transformer"
d_model: 64
nhead: 4
num_layers: 2
dim_feedforward: 128
dropout: 0.1
activation: "relu"
pooling: "attention"  # attention pooling or cls_token

training:
  batch_size: 256
  learning_rate: 0.0005
  weight_decay: 0.01
  max_epochs: 30
  early_stopping_patience: 5
  seed: 42
